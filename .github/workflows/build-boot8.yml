name: build-boot8

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Deps
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu cpio xxd cmake python3-pil

      - name: Build lzfse
        run: |
          set -eux
          git clone --depth 1 https://github.com/lzfse/lzfse.git
          cmake -S lzfse -B lzfse/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lzfse/build -j4
          find lzfse -maxdepth 3 -name lzfse -type f

      - name: Fetch kernel
        run: |
          set -eux
          curl -fL --retry 8 --retry-all-errors -o kernel.raw https://github.com/G3134377393/ios-port-marble/releases/download/kernel-latest/kernel.development.sweet
          ls -la kernel.raw
          sha256sum kernel.raw

      - name: Fetch Apple device tree from the private repo
        env:
          TOK: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eux
          curl -fL --retry 8 --retry-all-errors -H "Authorization: token $TOK" -H "Accept: application/vnd.github.raw" -H "User-Agent: dsh" -o DeviceTree.d22ap.im4p "https://api.github.com/repos/G3134377393/marble-uefi/contents/assets/DeviceTree.d22ap.im4p"
          ls -la DeviceTree.d22ap.im4p

      - name: Patch CNTP_CTL_EL0 to NOP
        run: |
          set -eux
          python3 - <<'PY'
          d = bytearray(open('kernel.raw','rb').read())
          pat = bytes.fromhex('28e21bd5')
          offs = []
          i = 0
          while True:
              j = d.find(pat, i)
              if j < 0: break
              offs.append(j); i = j + 1
          print('CNTP_CTL sites:', [hex(o) for o in offs])
          assert len(offs) == 1
          d[offs[0]:offs[0]+4] = bytes.fromhex('1f2003d5')
          open('kernel.patched','wb').write(bytes(d))
          PY

      - name: Unwrap device tree
        run: |
          set -eux
          python3 tools/unwrap-im4p.py DeviceTree.d22ap.im4p adt.lzfse
          LZFSE=$(find lzfse -maxdepth 3 -name lzfse -type f | head -1)
          "$LZFSE" -decode -i adt.lzfse -o d22ap.adt
          ls -la d22ap.adt

      - name: Build the 8-core ADT
        run: |
          set -eux
          D22AP_ADT="$PWD/d22ap.adt" python3 scripts/mkadt.py marble.adt --highmem
          ls -la marble.adt

      - name: Build payload and boot image
        run: |
          set -eux
          CMDS='debug=0xc serial=3 cpus=8 keepsyms=1 -noprogress rd=ufsroot0 ufsroot=userdata ufsrw=1 rootrw=1 wdt=-1 sweetusb=2 marbleusb=1 ufslogsecs=1 cs_debug=0 sweetsample=- cs_enforcement_disable=1 unentitled_ios_sim_launch=1 sweetkeys=1 sweettouch=0 marble_touch=1 sweetfb_noconsole=1 sweetiolog=- sweetadsp=1 gicrstride=0x40000 sweetbatt=1 sweetglink=1'
          python3 scripts/mkpayload.py kernel.patched marble.adt payload.bin --cmdline "$CMDS"
          cd shim
          # The upstream shim embeds a 1080x2400 boot splash (raw BGRA) and the
          # PCM clip handed to the DSP; shim/build_xnu.sh generates both from
          # splash.png before compiling (we reproduce it with the distro toolchain).
          python3 - <<'PY'
          from PIL import Image
          im = Image.open('splash.png').convert('RGB')
          raw = im.tobytes()
          n = im.width * im.height
          out = bytearray(n * 4)
          out[0::4] = raw[2::3]   # B
          out[1::4] = raw[1::3]   # G
          out[2::4] = raw[0::3]   # R
          out[3::4] = b'\xff' * n  # X
          open('splash.bgra', 'wb').write(out)
          print('splash.bgra: %dx%d, %d bytes' % (im.width, im.height, n * 4))
          PY
          python3 - <<'PY'
          import math, struct
          n = 20480  # shim.c PCM_REGION default (0x5000)
          pcm = bytearray()
          for i in range(n // 2):
              pcm += struct.pack('<h', int(6000 * math.sin(2 * math.pi * 1000 * i / 48000)))
          open('pcm.raw', 'wb').write(pcm[:n])
          print('pcm.raw: %d bytes' % n)
          PY
          CC=aarch64-linux-gnu-gcc
          OBJCOPY=aarch64-linux-gnu-objcopy
          CFLAGS="-O2 -ffreestanding -nostdlib -fno-pic -fno-jump-tables -mgeneral-regs-only -mstrict-align -fno-stack-protector -Wall -Wextra -Wno-unused-function -Wno-unused-variable -DFB_STRIDE=4320 -DPCM_REGION=20480 -DGPU_PROBE_LEVEL=0 -DGP_CBAR_BANK=-1 -DGP_CBAR_WRITE=0 -DGP_CBAR_COUNT=0 -DGP_SCTLR_BANK=-1 -DGP_SCTLR_WRITE=0 -DGP_CB_REGS=0 -DGP_GR1_READ=0 -DGP_KGSL_SCAN=0"
          mkdir -p out
          for f in start.S shim.c console.c mmu.c fdt.c loader.c splash.S pcm.S; do $CC $CFLAGS -c $f -o out/${f%.*}.o; done
          $CC $CFLAGS -static -T shim.ld -Wl,--build-id=none -Wl,--no-warn-rwx-segments -Wl,-N out/start.o out/shim.o out/console.o out/mmu.o out/fdt.o out/loader.o out/splash.o out/pcm.o -o out/shim.elf
          $OBJCOPY -O binary out/shim.elf out/Image
          size=$((16#$(aarch64-linux-gnu-nm out/shim.elf | awk '$3=="_end"{print $1}')))
          truncate -s "$size" out/Image
          truncate -s $(( (size + 0xfff) & ~0xfff )) out/Image
          cat "$GITHUB_WORKSPACE/payload.bin" >> out/Image
          python3 -c "import os,struct,sys; f=open(sys.argv[1],'r+b'); f.seek(16); f.write(struct.pack('<Q', os.path.getsize(sys.argv[1])))" out/Image
          (cd out && rm -rf rd && mkdir rd && cd rd && find . | cpio -o -H newc --quiet | gzip -9 > ../ramdisk.bin)
          python3 mkbootimg_v4.py --kernel out/Image --ramdisk out/ramdisk.bin --cmdline "console=null" -o out/marble-boot8.img
          ls -la out/marble-boot8.img
          sha256sum out/marble-boot8.img

      - name: Publish to the private repo
        env:
          TOK: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eux
          TAG=marble-xnu-boot8
          API=https://api.github.com
          REPO=G3134377393/marble-uefi
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $TOK" "$API/repos/$REPO/releases/tags/$TAG")
          if [ "$code" != "200" ]; then
            curl -sS -X POST -H "Authorization: token $TOK" -H "Content-Type: application/json" -d "{\"tag_name\":\"$TAG\",\"name\":\"marble boot image 8-core (GICR fix)\",\"body\":\"cpus=8 + GICR_PE_SIZE=0x40000 + 8 CPU ADT nodes\"}" "$API/repos/$REPO/releases" > /dev/null
          fi
          RID=$(curl -sS -H "Authorization: token $TOK" "$API/repos/$REPO/releases/tags/$TAG" | python3 -c 'import sys,json;print(json.load(sys.stdin)["id"])')
          curl -sS -H "Authorization: token $TOK" "$API/repos/$REPO/releases/$RID/assets" | python3 -c 'import sys,json;[print(a["id"]) for a in json.load(sys.stdin) if a["name"]=="marble-boot8.img"]' > /tmp/aid || true
          if [ -s /tmp/aid ]; then curl -sS -X DELETE -H "Authorization: token $TOK" "$API/repos/$REPO/releases/assets/$(cat /tmp/aid)" ; fi
          curl -sS --retry 5 -X POST -H "Authorization: token $TOK" -H "Content-Type: application/octet-stream" --data-binary @shim/out/marble-boot8.img "https://uploads.github.com/repos/$REPO/releases/$RID/assets?name=marble-boot8.img" | head -c 300
          echo
          curl -sS -H "Authorization: token $TOK" "$API/repos/$REPO/releases/tags/$TAG" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("assets:",[a["name"]+":"+str(a["size"]) for a in d["assets"]])'